name: App end-to-end tests

# The app Playwright suite is too slow for every push (about 1.3 h locally), but nothing ran it,
# so it broke unnoticed. It runs nightly beside Heavy tests and on every release tag.
on:
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Rewrite the Linux snapshot baselines from the runner image and upload them
        type: boolean
        default: false
  schedule:
    - cron: '17 3 * * *'
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  # A baseline dispatch is its own run: it must not replace a nightly test run, and the nightly must
  # not replace it. On schedule and tag pushes `inputs` is empty, so the group is the plain one and a
  # newer test run still replaces an older one.
  group: app-e2e-${{ github.ref }}${{ inputs.update_snapshots && '-baselines' || '' }}
  cancel-in-progress: true

env:
  PAIRDRAW_TEST_SERVER: app
  # CI never reuses a server started outside the run; fixtures own the servers they need.
  PAIRDRAW_TEST_REUSE_SERVER: '0'

jobs:
  linux-baselines:
    name: Linux snapshot baselines
    # Dispatch-only. Every screenshot baseline must come from this runner image: the font stack and
    # the GL stack decide the pixels, so a baseline made on a developer's machine fails here. The
    # job writes the `*-linux.png` files next to the `*-darwin.png` ones and uploads them; a person
    # commits them, because CI never pushes.
    if: github.event_name == 'workflow_dispatch' && inputs.update_snapshots == true
    # Its own group, never cancelled: a nightly run and a baseline dispatch may overlap, and the
    # baseline job must finish rather than be replaced by the other run.
    concurrency:
      group: app-e2e-linux-baselines
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - uses: ./.github/actions/setup-playwright

      - name: Build packages
        run: bun run build:packages

      - name: Rewrite the Linux baselines
        run: bun run test:update --grep-invert @real-llm --reporter=line

      - name: Upload the baselines
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-e2e-linux-baselines
          path: tests/e2e/**/*-snapshots/**
          retention-days: 7
          if-no-files-found: error

  app-e2e:
    name: App Playwright — shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - uses: ./.github/actions/setup-playwright

      - name: Build packages
        run: bun run build:packages

      - name: Run app Playwright shard
        run: bun run test --shard=${{ matrix.shard }}/4 --reporter=html,list --trace=retain-on-failure

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-e2e-report-${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  webkit:
    name: App Playwright — WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'

      - name: Install WebKit
        run: bunx playwright install --with-deps webkit

      - name: Build packages
        run: bun run build:packages

      # `pairdraw-webkit` collects the `*.webkit.spec.ts` files and the panel, export and font
      # specs that prove rendering under WebKit. `canvas/color-space.webkit` is known to fail on
      # CI's WebKit; it stays visible here rather than skipped.
      - name: Run WebKit project
        run: bunx playwright test --project=pairdraw-webkit --grep-invert @real-llm --reporter=html,list --trace=retain-on-failure

      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-e2e-report-webkit
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
