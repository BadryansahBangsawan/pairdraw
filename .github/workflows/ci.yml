name: CI

on:
  # Every base, so stacked pull requests are checked against the PR below them.
  pull_request:
  # The merge queue checks each queued change on top of the ones ahead of it.
  merge_group:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # In the merge queue, reads the queued PR's verified-tree status and the CI run behind it.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      icon: ${{ steps.classify.outputs.icon }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # A pull request's merge commit and its parents; the first parent is the base it merges into.
          fetch-depth: 2
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Fetch comparison base
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"

      - name: Select validation scope
        id: classify
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          # In the merge queue, a tree the pull request's CI already passed skips the suites.
          CI_EVENT: ${{ github.event_name }}
          CI_HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/policy/src/classify.ts

  commit-messages:
    name: Commit messages
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if ! bun run check:commits --from "$BASE_SHA" --to "$HEAD_SHA" --verbose; then
            echo '::error title=Commit messages::Check the messages listed above. Use type(scope): description, for example fix: preserve selection. See CONTRIBUTING.md#commit-messages.'
            exit 1
          fi

  documentation:
    name: Documentation
    needs: changes
    if: needs.changes.outputs.scope == 'docs'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-bun
      - name: Validate the changelog and its fragments
        run: bun run check:changelog
      - name: Build documentation type dependencies
        run: bun run build:packages
      - name: Validate documentation and generated references
        run: bun run check:docs
      - name: Build documentation and check examples
        run: bun run docs:build

  source-quality:
    name: Code quality
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      - name: Verify formatting
        run: bun run format:check

      - name: Lint TypeScript and Vue
        run: bun run lint

      - name: Typecheck application and SDKs
        run: bun run typecheck

      - name: Typecheck test suites
        run: bun run check:test-types

      - name: Typecheck repository tools
        run: bun run check:tools

      - name: Enforce architecture and type-shape boundaries
        run: bun run check:arch && bun run check:test-homes && bun run test:type-shapes

      - name: Build the editor without Cloud
        run: bun run check:cloud-off

  package-quality:
    name: Package integrity
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Cache npm consumer downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.npm
          key: npm-consumers-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: npm-consumers-${{ runner.os }}-

      - name: Build publishable packages
        run: bun run build:packages

      # The cli unit shard only builds Core, so it cannot run the built CLI.
      - name: Smoke-test the built CLI under Node
        run: bun test packages/cli/tests/node/smoke.test.ts

      - name: Validate installed package artifacts with Node and Bun
        run: bun run test:packages

      - name: Detect unused dependencies and files
        run: bun run check:deps

      - name: Validate workspace dependency policy
        run: bun run check:monorepo

  repository-quality:
    name: Repository hygiene
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Validate generated brand assets
        run: bun run check:icons

      - name: Validate translations
        run: bun run check:i18n

      - name: Validate documentation links and structure
        run: bun run check:docs

      - name: Validate the changelog and its fragments
        run: bun run check:changelog

      - name: Audit critical dependency vulnerabilities
        run: bun run check:audit

      - name: Scan for committed secrets
        run: bun run check:secrets

      - name: Test repository tooling
        run: bun run test:tools

      - name: Detect duplicated product code
        run: bun run test:dupes

  storybook:
    name: Component workshop
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Build component dependencies
        run: bun run build:packages

      - name: Build static Storybook
        run: bun run build-storybook

  native-test-contracts:
    name: Native app contracts
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 8
    runs-on: ubuntu-24.04
    container:
      # Published by native-contracts-image.yml; pin it by digest once that workflow has run.
      image: ghcr.io/badryansahbangsawan/native-contracts-ci:ubuntu-24.04
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop -> target
          key: native-test

      - uses: ./.github/actions/setup-bun

      - name: Typecheck native interaction tests
        run: bun run check:native-test

      - name: Generate native brand assets
        run: bun run generate:icons --target desktop

      - name: Compile native-test Tauri feature
        run: cargo check --manifest-path desktop/Cargo.toml --features native-test

  macos-icon:
    name: macOS icon catalog
    needs: changes
    # Compiles the Icon Composer icon with the release runners' actool whenever its inputs change
    # (tools/ci/policy/src/policy.ts, ICON_GUARD_INPUTS), so a manifest Xcode cannot compile fails
    # here instead of in a release build. A verified tree already passed it.
    if: needs.changes.outputs.icon == 'true' && needs.changes.outputs.scope != 'verified'
    # The release build's macOS image (build.yml native matrix, macos-latest = macos-26).
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate desktop brand assets
        run: bun run generate:icons --target desktop

      # The release build compiles the icon through this shim (build.yml); the step below calls
      # it with stdin closed, as tauri-bundler under Node does, so the shim is what passes here.
      - uses: ./.github/actions/actool-stdin

      - name: Compile the icon catalog with actool
        run: |
          set -euo pipefail
          actool --version
          work="$(mktemp -d)"
          # The same copy-and-compile tauri-bundler does (macos/icon.rs, create_assets_car_file).
          cp -R desktop/icons/icon.icon "$work/Icon.icon"
          mkdir "$work/out"
          # actool can exit 0 yet print a catalog-error block; tee the output (pipefail keeps
          # actool's own exit status) and fail on the block or any error: line, not only the exit.
          actool "$work/Icon.icon" \
            --compile "$work/out" \
            --output-format human-readable-text \
            --notices --warnings \
            --output-partial-info-plist "$work/out/assetcatalog_generated_info.plist" \
            --app-icon Icon \
            --include-all-app-icons \
            --accent-color AccentColor \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --minimum-deployment-target 26.0 \
            --platform macosx <&- 2>&1 | tee "$work/actool.log"
          if grep -qE 'com\.apple\.actool\.errors|error:' "$work/actool.log"; then
            echo "::error title=macOS icon::actool reported catalog errors"
            cat "$work/actool.log"
            exit 1
          fi
          test -f "$work/out/Assets.car"
          echo "ICON_CAR=$work/out/Assets.car" >> "$GITHUB_ENV"

      - name: Assert the catalog carries the light and dark appearances
        run: |
          set -euo pipefail
          assetutil --info "$ICON_CAR" > "$RUNNER_TEMP/icon-assets.json"
          cat "$RUNNER_TEMP/icon-assets.json"
          for appearance in Aqua DarkAqua; do
            # assetutil names appearances NSAppearanceNameAqua and NSAppearanceNameDarkAqua.
            if ! grep -q "\"NSAppearanceName$appearance\"" "$RUNNER_TEMP/icon-assets.json"; then
              echo "::error title=macOS icon::Assets.car has no $appearance appearance"
              exit 1
            fi
          done

  unit-tests:
    needs: changes
    if: needs.changes.outputs.scope == 'code' || needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        group: [app, cli, core, dom, fig, mcp, render, scene-graph, vue]
    name: Unit tests — ${{ matrix.group }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun
        with:
          lfs: 'true'
          # Quick shards read only the small fixtures; heavy-tests.yml pulls the large .fig corpora.
          lfs-include: tests/fixtures/gold-preview.fig,tests/fixtures/circle-text.fig,tests/fixtures/slots.fig,tests/fixtures/variable-override-precedence.fig,tests/fixtures/fonts/*

      - name: Build shared Core test dependency
        run: bun --filter @pairdraw/core build

      - name: Run ${{ matrix.group }} unit tests
        run: bun tools/dev/unit-tests/src/run.ts "${{ matrix.group }}"

  cloud-tests:
    name: Cloud package
    needs: changes
    if: needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      - name: Typecheck and run Cloud unit and integration tests
        run: bun run test:cloud

  cloud-storage:
    name: Cloud storage — ${{ matrix.store }}
    needs: changes
    if: needs.changes.outputs.scope == 'cloud'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # PostgreSQL and SeaweedFS: object-store checks, then the full revision flow.
          - store: SeaweedFS
            script: test:e2e
          # Garage's S3 compatibility for the object-store checks.
          - store: Garage
            script: test:e2e:garage
          # The Cloudflare Worker under wrangler dev, with its relay Durable Object, against
          # PostgreSQL and SeaweedFS.
          - store: Cloudflare Workers
            script: test:e2e:cloudflare
            worker: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-bun

      - name: Generate package declarations
        run: bun run build:packages

      # The editor's demo document draws its shader fills at build time in a headless Chromium.
      - name: Install Chromium for the demo document
        if: matrix.worker
        uses: ./.github/actions/setup-playwright

      # The Worker serves the editor and the portal as static assets.
      - name: Build the Cloud site
        if: matrix.worker
        run: bun run build:cloud

      - name: Run Cloud end-to-end tests against ${{ matrix.store }}
        env:
          CLOUD_E2E_SCRIPT: ${{ matrix.script }}
        run: bun --filter @pairdraw/cloud "$CLOUD_E2E_SCRIPT"

  result:
    name: CI result
    needs: [changes, commit-messages, documentation, source-quality, package-quality, repository-quality, storybook, native-test-contracts, macos-icon, unit-tests, cloud-tests, cloud-storage]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 3
    # Records the verified tree as a commit status once the gate has passed.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Require successful checks for the selected scope
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: bun tools/ci/policy/src/gate.ts
      # Lets the merge queue skip the suites when it tests this exact tree. Forks cannot write it,
      # and the queue accepts it only from this run. Recording is an optimization: a failure
      # leaves the queue to run every check, so it must not fail the gate.
      - name: Record the verified tree
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun tools/ci/policy/src/verified-tree/record.ts
