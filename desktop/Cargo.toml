[package]
name = "pairdraw"
version = "0.19.1"
description = "Pairdraw desktop app"
authors = ["Badryansah Bangsawan"]
edition = "2021"

[features]
default = []
native-test = ["dep:tauri-plugin-wdio-webdriver"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "Pairdraw"
path = "src/main.rs"

[lib]
name = "pairdraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "=1.0.9", features = ["build"] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["rt", "sync", "time"] }
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = { version = "2.4.5", features = ["watch"] }
tauri-plugin-shell = "2"
tauri-plugin-notification = "2.8.0"
zstd = "0.13"
zip = { version = "2", default-features = false }
which = "7.0.3"
# The slot names the built-in browser parks awaited answers under come from the OS CSPRNG.
getrandom = "0.2"
semver = "1"
fontique = "0.11"
# The same read-fonts fontique uses, to read each face's style names and named instances.
read-fonts = "0.41"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs", branch = "dev" }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
keyring = "4.1.5"
url = "2"
httparse = "1"
# Reads Codex's `config.toml` to check an MCP setup edit changes only its own server.
toml = "1.1"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[dev-dependencies]
write-fonts = "=0.50.0"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"
swift-rs = "=1.0.9"
base64 = "0.22.1"
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-web-kit = "0.3.2"
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFBase", "CFDictionary", "CFSet", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3.2", default-features = false, features = ["std", "CTFontDescriptor"] }

# Tauri's own copy, to read the WebKitGTK version before the webview starts (`explicit_sync`).
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk-sys = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

